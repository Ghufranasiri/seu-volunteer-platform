{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>
<body>

<nav class="navbar navbar-expand-lg custom-navbar">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">SEU Volunteer</a>

        <div class="collapse navbar-collapse show">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'opportunities:opportunity_list' %}">Opportunities</a></li>
                <li class="nav-item"><a class="nav-link" href="/dashboard/">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link active" href="{% url 'login' %}">Login</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-5" style="max-width:600px;">

<h2 class="mb-4 text-center">Create Account</h2>

<form method="POST">
{% csrf_token %}

<div class="row">

<div class="col-md-6 mb-3">
<label>First Name</label>
<input type="text" name="first_name" class="form-control" required>
</div>

<div class="col-md-6 mb-3">
<label>Last Name</label>
<input type="text" name="last_name" class="form-control" required>
</div>

</div>

<div class="mb-3">
<label>Email</label>
<input type="email" name="email" class="form-control" required>
</div>

<div class="mb-3">
<label>University ID</label>
<input type="text" name="university_id" class="form-control">
</div>

<div class="mb-3">
<label>Password</label>
<input type="password" name="password" class="form-control" required>
</div>

<div class="mb-3">
<label>Confirm Password</label>
<input type="password" name="confirm_password" class="form-control" required>
</div>

<div class="mb-4">
<label>Register As</label>
<select name="role" class="form-control">
<option value="student">Student</option>
<option value="agency">Volunteer Organization</option>
</select>
</div>

<button class="btn btn-primary w-100 rounded-pill">
Create Account
</button>

</form>

<div class="text-center mt-3">

<a href="{% url 'login' %}">
Already have an account? Login
</a>

</div>

</div>

</body>
</html>
