{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

<nav class="navbar navbar-expand-lg custom-navbar">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">SEU Volunteer</a>

        <div class="collapse navbar-collapse show">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'opportunities:opportunity_list' %}">Opportunities</a></li>
                <li class="nav-item"><a class="nav-link" href="/dashboard/">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link active" href="{% url 'login' %}">Login</a></li>
            </ul>
        </div>
    </div>
</nav>

<section class="dashboard-section">
    <div class="container" style="max-width: 500px;">

        <div class="dashboard-panel d-block mt-5">

            <h2 class="text-center fw-bold mb-4" style="color:#0d1b4d;">
                Login
            </h2>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-info">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" required>
                </div>

                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>

                <button class="dashboard-btn w-100">
                    Login
                </button>
            </form>

            <div class="text-center mt-3">
                <a href="{% url 'register' %}">
                    Don’t have an account? Register
                </a>
            </div>

        </div>

    </div>
</section>

</body>
</html>
